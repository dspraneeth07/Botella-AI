[project]
name = "contextual-intelligence-service"
version = "0.1.0"
description = "Signal-aware daily product recommendations for liquor stores (8-10 per store/day)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.69",
    "structlog>=24.1",
    # StoreAgent module: read-only warehouse access (the only dep it adds).
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "storeagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection pattern puts Depends(...) in argument defaults.
"app/api/routes.py" = ["B008"]
# Diagnostic CLI: long human-readable report strings are fine.
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

  <!-- Favicon - multi-format set generated by public/_build_favicon.py.
       Modern browsers prefer the SVG (crisp at any size, tiny file).
       PNGs are the safe fallbacks for older browsers + mobile home screens.
       The order matters: browsers pick the first format they understand. -->

  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />

    },
    "foundingDate": "2024",
    "areaServed": {
      "@type": "Country",
      "name": "United States"
    },
    "contactPoint": [

        "@type": "ContactPoint",

      },

        "@type": "ContactPoint",

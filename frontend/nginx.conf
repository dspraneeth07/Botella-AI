# Frontend container nginx: serves the React SPA and proxies API traffic to the
# backend container over the compose-internal network (service name "backend").
# This sits BEHIND the host's nginx, which terminates TLS and forwards to :8080.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: hand every non-file path back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Long-cache the fingerprinted CRA assets.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API -> Node backend (same compose network).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # AI/LLM endpoints are slow
        client_max_body_size 25m;      # xlsx uploads via multer
    }

    # Generated marketing images/videos are served by the backend.
    location /imagegen-files/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}

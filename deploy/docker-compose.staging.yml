# STAGING stack for the staging EC2 box. Pulls pre-built images from the GitLab
# Container Registry — it never builds here. Image tags come from the ./.env file
# the deploy job writes (BACKEND_TAG / FRONTEND_TAG = deployed git short SHA).
#
# App secrets are read from ./backend.env, rendered on the server by the deploy
# job from the STAGING_BACKEND_ENV CI variable. The Python StoreAgent service runs
# in its own compose stack; this stack reaches it over the host loopback.
services:
  backend:
    image: ${REGISTRY}/backend:${BACKEND_TAG:-staging}
    env_file: ./backend.env
    environment:
      # Container networking override (wins over backend.env):
      # StoreAgent is published on the host at :8000.
      STOREAGENT_API_URL: http://host.docker.internal:8000/storeagent
    extra_hosts:
      # Reach host-published services. IMPORTANT: in backend.env, any host that
      # points at something on this EC2 box (e.g. ANALYTICS_PG_HOST=localhost)
      # must become host.docker.internal — "localhost" inside a container is the
      # container itself. Genuinely remote addresses stay unchanged.
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback ONLY, so StoreAgent's host.docker.internal:3000 callback resolves.
      # Not internet-exposed — the security group must not open 3000.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data      # generated imagegen output (served static)
    networks: [botella]

  frontend:
    image: ${REGISTRY}/frontend:${FRONTEND_TAG:-staging}
    depends_on:
      backend:
        condition: service_started
    ports:
      # Host nginx (TLS for staging.botella.ai) proxies here. Loopback only.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks: [botella]

volumes:
  backend_logs:
  backend_data:

networks:
  botella:
    driver: bridge